# Endpoints for the load balancer health check, included by the default server

# nginx only: proves the web server answers
location /healthz {
  access_log off;
  auth_basic "off";
  return 200;
}

# answered by the health fpm pool: proves php-fpm answers, without application code
location = /fpm-ping {
  access_log off;
  auth_basic "off";
  include fastcgi_params;
  fastcgi_pass unix:/var/run/php/php-fpm-health.sock;
}
