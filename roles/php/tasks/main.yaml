---

# Install php

- name: Add extra packages for php
  ansible.builtin.apt:
    name:
      - gnupg

# the libheif decoder is a separate package from debian 13 on
- name: Add the heif decoder plugin
  ansible.builtin.apt:
    name: libheif-plugin-libde265
  when: ansible_facts['distribution_major_version'] is version('13', '>=')

- name: Install ondrej key
  ansible.builtin.apt:
    deb: https://packages.sury.org/debsuryorg-archive-keyring.deb

- name: Sury PHP-Repository hinzufügen
  ansible.builtin.deb822_repository:
    name: sury-php
    types: deb
    uris: https://packages.sury.org/php/
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: main
    signed_by: /usr/share/keyrings/debsuryorg-archive-keyring.gpg
    state: present

- name: "Install packages for php {{ php_version }}"
  ansible.builtin.apt:
    name:
      - "php{{ php_version }}-bcmath"
      - "php{{ php_version }}-cli"
      - "php{{ php_version }}-curl"
      - "php{{ php_version }}-fpm"
      - "php{{ php_version }}-gd"
      - "php{{ php_version }}-imagick"
      - "php{{ php_version }}-intl"
      - "php{{ php_version }}-mbstring"
      - "php{{ php_version }}-mysql"
      - "php{{ php_version }}-soap"
      - "php{{ php_version }}-xml"
      - "php{{ php_version }}-zip"
    update_cache: true

# opcache is compiled into the binary from php 8.5, the module package is gone
- name: "Install the opcache module for php {{ php_version }}"
  ansible.builtin.apt:
    name: "php{{ php_version }}-opcache"
  when: php_version is version('8.5', '<')

- name: Delete default files
  ansible.builtin.file:
    path: '{{ item }}'
    state: absent
  with_items:
    - "/etc/php/{{ php_version }}/fpm/pool.d/www.conf"
