; Pool for the load balancer health check, answers without touching application code
[health]
user = www-data
group = www-data
listen = /var/run/php/php-fpm-health.sock
listen.owner = www-data
listen.group = www-data
pm = static
pm.max_children = 2
ping.path = /fpm-ping
ping.response = pong
chdir = /
